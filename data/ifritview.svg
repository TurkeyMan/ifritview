<?xml version="1.0" encoding="UTF-8"?>
<!-- IfritView: a fiery djinn with a cat's face, nodding to IrfanView's red cat. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a2e"/>
      <stop offset="1" stop-color="#140b16"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b5160f"/>
      <stop offset="0.45" stop-color="#e8381a"/>
      <stop offset="0.8" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffd64a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a2a"/>
      <stop offset="1" stop-color="#d4200f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#glow)"/>

  <!-- smoke/flame body rising from the bottom, genie-style -->
  <path fill="url(#flame)" d="
    M128 236
    C 96 236, 70 214, 72 186
    C 73 170, 84 164, 90 150
    C 94 140, 86 128, 94 112
    C 100 100, 112 98, 118 90
    C 110 108, 118 118, 128 124
    C 138 118, 146 108, 138 90
    C 144 98, 156 100, 162 112
    C 170 128, 162 140, 166 150
    C 172 164, 183 170, 184 186
    C 186 214, 160 236, 128 236 Z"/>

  <!-- cat head with flame-tipped ears -->
  <path fill="url(#face)" d="
    M128 166
    C 100 166, 80 150, 78 124
    C 77 112, 74 96, 68 72
    C 66 62, 72 60, 80 68
    C 90 80, 98 86, 104 86
    C 112 82, 120 80, 128 80
    C 136 80, 144 82, 152 86
    C 158 86, 166 80, 176 68
    C 184 60, 190 62, 188 72
    C 182 96, 179 112, 178 124
    C 176 150, 156 166, 128 166 Z"/>
  <!-- ear flame licks -->
  <path fill="#ffd64a" d="M70 70 C 74 58, 68 52, 76 44 C 76 56, 84 60, 82 70 Z"/>
  <path fill="#ffd64a" d="M186 70 C 182 58, 188 52, 180 44 C 180 56, 172 60, 174 70 Z"/>

  <!-- eyes -->
  <ellipse cx="108" cy="118" rx="11" ry="12" fill="#ffe66a"/>
  <ellipse cx="148" cy="118" rx="11" ry="12" fill="#ffe66a"/>
  <ellipse cx="108" cy="119" rx="3.5" ry="9" fill="#1a0a10"/>
  <ellipse cx="148" cy="119" rx="3.5" ry="9" fill="#1a0a10"/>

  <!-- nose and grin -->
  <path fill="#1a0a10" d="M123 136 L133 136 L128 143 Z"/>
  <path fill="none" stroke="#1a0a10" stroke-width="3.5" stroke-linecap="round"
        d="M112 146 C 118 154, 124 152, 128 146 C 132 152, 138 154, 144 146"/>
  <!-- whiskers -->
  <path fill="none" stroke="#ffd64a" stroke-width="2.5" stroke-linecap="round" opacity="0.85"
        d="M96 136 L78 132 M96 142 L80 146 M160 136 L178 132 M160 142 L176 146"/>
</svg>
