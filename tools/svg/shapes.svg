<!-- Basic shapes, filled, stroked and half transparent, on a transparent canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120">
  <rect x="10" y="10" width="80" height="60" rx="8" fill="#e33" stroke="#000" stroke-width="3"/>
  <circle cx="140" cy="45" r="35" fill="#36c" fill-opacity="0.5"/>
  <ellipse cx="60" cy="95" rx="45" ry="15" fill="none" stroke="#2a2" stroke-width="4" stroke-dasharray="8 4"/>
  <polygon points="130,110 160,80 190,110" fill="#fc0"/>
  <path d="M100 20 Q 120 0 140 20 T 180 20" fill="none" stroke="#909" stroke-width="2"/>
</svg>
